  <!-- PWA Manifest inline -->
  <script>
    const manifestData = {
      name: "Superhero Workout Tracker",
      short_name: "Superhero",
      description: "Pelin & Ahmet workout tracker",
      start_url: "./",
      display: "standalone",
      background_color: "#111111",
      theme_color: "#e8722a",
      orientation: "portrait",
      icons: [
        { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='32' fill='%23e8722a'/><text y='140' x='20' font-size='130'>💪</text></svg>", sizes: "192x192", type: "image/svg+xml" },
        { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='80' fill='%23e8722a'/><text y='380' x='40' font-size='360'>💪</text></svg>", sizes: "512x512", type: "image/svg+xml" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    document.write('<link rel="manifest" href="' + manifestURL + '">');
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #111; overflow-x: hidden; }
    input[type=number] { -moz-appearance: textfield; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    #root { min-height: 100vh; }

    /* PWA install banner */
    #install-banner {
      display: none;
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 448px;
      background: linear-gradient(135deg, #1f1f1f, #2a2a2a);
      border: 1px solid rgba(232,114,42,.4);
      border-radius: 16px; padding: 14px 16px;
      z-index: 9999; box-shadow: 0 8px 32px rgba(0,0,0,.6);
      align-items: center; gap: 12px;
    }
    #install-banner.show { display: flex; }
    #install-banner p { flex: 1; font-size: 13px; color: #f0e6d3; font-family: 'Trebuchet MS', sans-serif; }
    #install-banner p strong { color: #f5c842; }
    #install-btn {
      background: linear-gradient(135deg, #e8722a, #c45a1a);
      border: none; border-radius: 10px; color: #fff;
      font-size: 13px; font-weight: 800; padding: 8px 14px; cursor: pointer;
      font-family: 'Trebuchet MS', sans-serif; white-space: nowrap;
    }
    #dismiss-btn {
      background: transparent; border: none; color: #6b7280;
      font-size: 18px; cursor: pointer; padding: 4px;
    }

    /* iOS install hint */
    #ios-hint {
      display: none;
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 448px;
      background: linear-gradient(135deg, #1f1f1f, #2a2a2a);
      border: 1px solid rgba(232,114,42,.4);
      border-radius: 16px; padding: 14px 16px;
      z-index: 9999; box-shadow: 0 8px 32px rgba(0,0,0,.6);
    }
    #ios-hint.show { display: block; }
    #ios-hint p { font-size: 13px; color: #f0e6d3; font-family: 'Trebuchet MS', sans-serif; line-height: 1.5; }
    #ios-hint strong { color: #f5c842; }
    #ios-hint button {
      margin-top: 10px; background: transparent; border: none;
      color: #6b7280; font-size: 12px; cursor: pointer;
      font-family: 'Trebuchet MS', sans-serif;
    }
  </style>
</head>

      B: ["Squat", "Bench Press", "Assisted Pull Ups", "Cable Lateral Raises", "Incline Dumbbell Curl", "Leg Raises"],

    const WORKOUT_OVERRIDES = {
      B: { "Bench Press": { sets: 3, reps: 10 } },
      C: { "Squat":       { sets: 3, reps: 10 } },
    };

    function getExConfig(exercise, workout) {
      const override = WORKOUT_OVERRIDES[workout]?.[exercise];
      return override ? { ...EXERCISES[exercise], ...override } : EXERCISES[exercise];
    }

    const WEEKS = Array.from({ length: 12 }, (_, i) => `Hafta ${i + 1}`);

    function parseReps(reps) {
      if (reps === "max") return { min: 1, max: 999 };
      if (typeof reps === "string" && reps.includes("-")) {
        const [a, b] = reps.split("-").map(Number);
        return { min: a, max: b };
      }
      return { min: Number(reps), max: Number(reps) };
    }

    function checkSuccess(exercise, loggedSets, workout = "A") {
      const ex = getExConfig(exercise, workout);
      if (!ex || ex.reps === "max") return { success: true };
      const valid = loggedSets.filter(s => s !== null && s !== undefined && s !== "" && !isNaN(Number(s)));
      if (valid.length < ex.sets) return { success: false };
      const { min } = parseReps(ex.reps);
      return { success: valid.every(s => Number(s) >= min) };
    }

    const USERS = [
      { id: "pelin", name: "Pelin", emoji: "🌸", storageKey: "pelin-v3", defaultBw: 55 },
      { id: "ahmet", name: "Ahmet", emoji: "💪", storageKey: "ahmet-v1", defaultBw: 80 },
    ];

    function loadUserData(storageKey) {
      try {
        const raw = localStorage.getItem(storageKey);
        if (raw) return JSON.parse(raw);
      } catch {}
      return JSON.parse(JSON.stringify(EXCEL_DATA));
    }

    function App() {
      const [activeUser, setActiveUser] = useState(0);
      const [allData, setAllData] = useState(() => ({
        pelin: loadUserData("pelin-v3"),
        ahmet: loadUserData("ahmet-v1"),
      }));
      const [bodyWeights, setBodyWeights] = useState({ pelin: 55, ahmet: 80 });

      const userId = USERS[activeUser].id;
      const data = allData[userId];
      const bodyWeight = bodyWeights[userId];

      function setData(updater) {
        setAllData(prev => ({
          ...prev,
          [userId]: typeof updater === "function" ? updater(prev[userId]) : updater,
        }));
      }
      function setBodyWeight(val) {
        setBodyWeights(prev => ({ ...prev, [userId]: val }));
      }

      const [weekIdx, setWeekIdx] = useState(10);
      const [workout, setWorkout] = useState("A");
      const [expanded, setExpanded] = useState(null);
      const [showProgress, setShowProgress] = useState(false);
      const [themeIdx, setThemeIdx] = useState(0);

      const THEMES = [
        { name: "🐾 Pawvera", bg: "linear-gradient(170deg,#1c1c1c 0%,#111111 40%,#0d0d0d 100%)", hbg: "#1c1c1c", primary: "#e8722a", pRgb: "232,114,42", light: "#f5c842", grad: "linear-gradient(90deg,#f5c842,#e8722a)", barGrad: "linear-gradient(90deg,#e8722a,#f5c842)", btnGrad: "linear-gradient(135deg,#e8722a,#c45a1a)", chartGrad: "linear-gradient(180deg,#f5c842,#e8722a)" },
        { name: "🌸 Pembe",   bg: "linear-gradient(170deg,#1a0f1e 0%,#110a18 40%,#0c0812 100%)", hbg: "#1a1228", primary: "#db2777", pRgb: "219,39,119",  light: "#fbcfe8", grad: "linear-gradient(90deg,#fbcfe8,#f0abfc)", barGrad: "linear-gradient(90deg,#db2777,#f9a8d4)", btnGrad: "linear-gradient(135deg,#db2777,#be185d)", chartGrad: "linear-gradient(180deg,#fbcfe8,#db2777)" },
        { name: "🌊 Okyanus", bg: "linear-gradient(170deg,#081420 0%,#020b14 40%,#010810 100%)", hbg: "#031524", primary: "#0891b2", pRgb: "8,145,178",   light: "#a5f3fc", grad: "linear-gradient(90deg,#a5f3fc,#67e8f9)", barGrad: "linear-gradient(90deg,#0891b2,#22d3ee)", btnGrad: "linear-gradient(135deg,#0891b2,#0e7490)", chartGrad: "linear-gradient(180deg,#a5f3fc,#0891b2)" },
        { name: "☀️ Altın",   bg: "linear-gradient(170deg,#181200 0%,#0e0b00 40%,#0a0800 100%)", hbg: "#141200", primary: "#d97706", pRgb: "217,119,6",   light: "#fde68a", grad: "linear-gradient(90deg,#fde68a,#fcd34d)", barGrad: "linear-gradient(90deg,#d97706,#fbbf24)", btnGrad: "linear-gradient(135deg,#d97706,#b45309)", chartGrad: "linear-gradient(180deg,#fde68a,#d97706)" },
        { name: "🌿 Orman",   bg: "linear-gradient(170deg,#081408 0%,#030e03 40%,#020b02 100%)", hbg: "#031508", primary: "#16a34a", pRgb: "22,163,74",   light: "#bbf7d0", grad: "linear-gradient(90deg,#bbf7d0,#86efac)", barGrad: "linear-gradient(90deg,#16a34a,#4ade80)", btnGrad: "linear-gradient(135deg,#16a34a,#15803d)", chartGrad: "linear-gradient(180deg,#bbf7d0,#16a34a)" },

        return data[weekKey]?.[ex] || { weight: null, sets: [], note: null };

        setData(prev => ({ ...prev, [weekKey]: { ...prev[weekKey], [ex]: { ...getEx(ex), weight: parseFloat(val) || 0 } } }));

        sets[idx] = val === "" ? null : val;
        setData(prev => ({ ...prev, [weekKey]: { ...prev[weekKey], [ex]: { ...exd, sets } } }));

      const completed = exercises.filter(ex => {

      const S = {

                <div style={{ fontSize: 26, fontWeight: 900, lineHeight: 1.15, ...S.gradText }}>
                  {USERS[activeUser].name}'s Tracker
                </div>
              </div>
              <div style={{ textAlign: "right" }}>

                  <span style={{ color: T.light, fontWeight: 800 }}>{completed}/{exercises.length} tamamlandı</span>
                </div>
                <div style={{ height: 7, background: "rgba(255,255,255,.06)", borderRadius: 4, overflow: "hidden" }}>

                  const weight = exd.weight;
                  const loggedSets = exd.sets || [];
                  const isBodyweight = weight === "bodyweight" || exInfo.reps === "max";
                  const filledCount = loggedSets.filter(s => s !== null && s !== undefined && s !== "").length;
                  const isComplete = filledCount >= exInfo.sets;

                    if (val === null || val === undefined || val === "") return "empty";
                    if (isNaN(Number(val))) return "text";
                    const { min } = parseReps(exInfo.reps);

                  if (!isOpen) return (

                      {!isComplete && (

                      )}

                              onChange={e => setAssist("Assisted Pull Ups", e.target.value)}
                              style={{ width: 68, padding: "5px 8px", textAlign: "center", background: "rgba(99,102,241,.15)", border: "1.5px solid rgba(99,102,241,.5)", borderRadius: 8, color: "#c7d2fe", fontSize: 17, fontWeight: 900 }} />
                            <span style={{ fontSize: 12, color: "#6b7280" }}>kg yardım</span>
                            {exd.assist && <span style={{ marginLeft: "auto", fontSize: 11, color: "#818cf8", fontWeight: 700 }}>↓ az = güçlü</span>}
                          </div>
                        )}

                        <div style={{ display: "grid", gridTemplateColumns: `repeat(${Math.min(exInfo.sets, 4)}, 1fr)`, gap: 8, marginBottom: 12 }}>
                          {Array.from({ length: exInfo.sets }, (_, i) => {
                            const val = loggedSets[i];
                            const col = getCol(val);
                            return (
                              <div key={i}>
                                <div style={{ fontSize: 10, color: "#6b7280", textAlign: "center", marginBottom: 4 }}>Set {i + 1}</div>
                                <input
                                  type={ex === "Plank" ? "text" : "number"}
                                  placeholder={exInfo.reps === "max" ? "max" : typeof exInfo.reps === "number" ? String(exInfo.reps) : exInfo.reps.split("-")[0]}
                                  value={val ?? ""}
                                  onChange={e => logSet(ex, i, e.target.value)}
                                  style={S.setInput(col === "empty" ? null : col)}
                                />
                                <div style={{ fontSize: 9, color: "#4b5563", textAlign: "center", marginTop: 3 }}>{ex === "Plank" ? "süre" : "tekrar"}</div>
                              </div>
                            );
                          })}
                        </div>

                        <div style={{ padding: "8px 12px", borderRadius: 9, background: "rgba(255,255,255,.03)", fontSize: 11, color: "#9ca3af", display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 4, marginBottom: 8 }}>
                          <span>🎯 {exInfo.sets}×{exInfo.reps} tekrar</span>
                          {!isBodyweight && isComplete && nextW !== null && (
                            <span style={{ fontWeight: 700, color: success ? "#34d399" : "#fbbf24" }}>
                              {success ? `↑ Sonraki: ${nextW} kg` : `→ Sabit: ${weight} kg`}
                            </span>
                          )}
                        </div>

                        {exd.note && (
                          <div style={{ marginBottom: 6, padding: "6px 10px", background: "rgba(251,191,36,.08)", borderRadius: 8, fontSize: 12, color: "#fbbf24" }}>📝 {exd.note}</div>
                        )}
                        <input placeholder="Not ekle / düzenle..." value={exd.note || ""} onChange={e => setNote(ex, e.target.value)}
                          style={{ width: "100%", padding: "8px 10px", boxSizing: "border-box", background: "rgba(255,255,255,.03)", border: "1px solid rgba(255,255,255,.07)", borderRadius: 8, color: "#9ca3af", fontSize: 12 }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ) : (
            <div style={{ padding: "16px 16px 140px" }}>
              <div style={{ fontSize: 18, fontWeight: 900, marginBottom: 18, ...S.gradText }}>📈 {USERS[activeUser].name} — İlerleme Grafiği</div>
              {["Bench Press", "Squat", "Over Head Press", "Romanian DL", "Shoulder Press Machine", "Machine Row", "Lat Pulldown", "Leg Extension", "Cable Pushdown", "Incline Dumbbell Curl", "Cable Lateral Raises"].map(ex => {
                const weights = WEEKS.map(w => { const d = data[w]?.[ex]; return d && typeof d.weight === "number" ? d.weight : null; });
                const valid = weights.filter(w => w !== null);
                if (valid.length === 0) return null;
                const maxW = Math.max(...valid), minW = Math.min(...valid), range = maxW - minW || 1;
                const diff = valid[valid.length - 1] - valid[0];
                return (
                  <div key={ex} style={{ marginBottom: 14, padding: "14px 14px 10px", background: "rgba(255,255,255,.03)", borderRadius: 14, border: "1px solid rgba(255,255,255,.07)" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                      <div style={{ fontWeight: 700, fontSize: 13 }}>{ex}</div>
                      <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                        <span style={{ fontSize: 11, fontWeight: 700, color: diff >= 0 ? "#34d399" : "#f87171" }}>{diff >= 0 ? "+" : ""}{diff.toFixed(1)} kg</span>
                        <span style={{ fontSize: 14, color: T.light, fontWeight: 800 }}>{weights[weekIdx] ?? "-"} kg</span>
                      </div>
                    </div>
                    <div style={{ display: "flex", alignItems: "flex-end", gap: 3, height: 48 }}>
                      {WEEKS.map((w, i) => {
                        const wt = weights[i];
                        if (!wt) return <div key={i} style={{ flex: 1 }}><div style={{ height: 4, borderRadius: "2px 2px 0 0", background: "rgba(255,255,255,.04)" }} /><div style={{ fontSize: 7, color: "#374151", textAlign: "center", marginTop: 2 }}>{i + 1}</div></div>;
                        const h = Math.max(6, ((wt - minW) / range) * 36 + 12);
                        return (
                          <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                            <div style={{ width: "100%", height: h, borderRadius: "3px 3px 0 0", background: i === weekIdx ? T.chartGrad : `rgba(${T.pRgb},.35)` }} />
                            <div style={{ fontSize: 7, color: i === weekIdx ? T.light : "#4b5563" }}>{i + 1}</div>
                          </div>
                        );
                      })}
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, fontSize: 10, color: "#6b7280" }}>
                      <span>Başlangıç: {valid[0]} kg</span>
                      <span>Maks: {maxW} kg</span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 480, background: `linear-gradient(0deg,${T.hbg} 65%,rgba(0,0,0,0))`, padding: "12px 16px 20px", zIndex: 200 }}>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={() => setShowProgress(false)} style={S.navBtn(!showProgress)}>🏋️ Antrenman</button>
              <button onClick={() => setShowProgress(true)} style={S.navBtn(showProgress)}>📊 İlerleme</button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    // ── Service Worker (offline cache) ──
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE = 'superhero-v1';
        const ASSETS = [
          'https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js',
        ];
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
          self.skipWaiting();
        });
        self.addEventListener('activate', e => {
          e.waitUntil(caches.keys().then(keys =>
            Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
          ));
          self.clients.claim();
        });
        self.addEventListener('fetch', e => {
          e.respondWith(
            caches.match(e.request).then(cached => cached || fetch(e.request).then(resp => {
              const clone = resp.clone();
              caches.open(CACHE).then(c => c.put(e.request, clone));
              return resp;
            }))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swURL = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swURL);
    }

    // ── PWA Install prompt ──
    let deferredPrompt = null;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone) {
        document.getElementById('install-banner').classList.add('show');
      }
    });

    document.getElementById('install-btn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        document.getElementById('install-banner').classList.remove('show');
      }
    });

    document.getElementById('dismiss-btn').addEventListener('click', () => {
      document.getElementById('install-banner').classList.remove('show');
    });

    // iOS hint (sadece Safari'de, standalone değilse)
    if (isIOS && !isStandalone && /safari/i.test(navigator.userAgent) && !/crios|fxios/i.test(navigator.userAgent)) {
      setTimeout(() => {
        document.getElementById('ios-hint').classList.add('show');
      }, 2500);
    }
  </script>
</body>
</html>
